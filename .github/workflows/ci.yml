name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  # The window's frontend: lint, types, the locale check, tests and a build.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Gate
        run: pnpm lint
      - name: Build
        run: pnpm build

  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Nothing here is Windows-specific: the full matrix from day one.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      # The window crate is a workspace member, and Tauri needs the system
      # webview's headers on Linux; Windows and macOS ship theirs.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      # `prose` is off by default, so everything under it is invisible to
      # every command above: an optional feature nobody builds is code that
      # compiles on the author's machine and nowhere else. Linted and tested
      # on its own, because that is the only place it is compiled at all.
      - name: Lint (prose)
        run: cargo clippy --all-targets --features prose -- -D warnings
      # The test suite builds git repositories from nothing and runs the binary
      # against them, so git has to be on PATH and the committer has to be
      # named. Both hold on every runner; the tests clear the global config
      # rather than relying on one.
      - name: Test
        run: cargo test
      # The tests differ by feature rather than merely growing: the default
      # build asserts that `--prose` does not exist, and the feature build
      # asserts that it exists and stays quiet until asked. Neither statement
      # can be checked from the other build.
      - name: Test (prose)
        run: cargo test --features prose
      - name: Build
        run: cargo build --release

  # rust-version is a promise to anyone building from source. Without a job
  # that actually builds on it, the number silently rots the first time a new
  # API is used — so read it from the manifest and hold it to it.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # The workspace manifest carries no package of its own, so the version is
      # read from a member rather than from `packages[0]`, which is whichever
      # crate cargo happened to list first.
      - name: Read rust-version from the manifest
        id: msrv
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "nooma") | .rust_version')
          test -n "$version" || { echo "no rust-version in the manifest"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Build on the declared MSRV
        run: cargo check --all-targets
