[package]
name = "nooma-app"
description = "The nooma window: one field searching your folders, fully offline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# The window ships as an installer from the release page, not as a crate.
publish = false

[lib]
# The shell is a library with a thin binary in front of it, so tests reach the
# commands without opening a window.
# Named apart from the binary: on Windows both would write nooma_app.pdb.
name = "nooma_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The window searches by meaning too, so it runs the model, and fetches it
# when the person asks - through nooma-fetch, the one crate with a network
# client in it.
nooma-core = { workspace = true, features = ["semantic"] }
nooma-fetch.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# The window comes back where and how large it was closed.
tauri-plugin-window-state = "2"
# Where Obsidian keeps its list of vaults: the user's configuration folder.
directories.workspace = true

# What the shell opens a kind of file with, so a document opens in the
# program a double click would start - told the place found in it. The
# major nitid and the OCR crate are on, so the tree holds one copy.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Shell"] }

[dev-dependencies]
tempfile.workspace = true
