[workspace]
members = ["crates/nooma", "crates/nooma-core", "crates/nooma-fetch", "app/src-tauri"]
resolver = "3"

# Everything published or built from this tree shares one identity. The library
# and the binary ship together: `nooma-core` is not versioned apart from the
# product it belongs to.
[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/lacodda/nooma"
homepage = "https://github.com/lacodda/nooma"
authors = ["Kirill Lakhtachev <lahtachev@gmail.com>"]

[workspace.dependencies]
nooma-core = { path = "crates/nooma-core", version = "0.6.0" }
nooma-fetch = { path = "crates/nooma-fetch", version = "0.6.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Reading the repository: what the commit is, and which files it holds.
gix = { version = "0.88.0", default-features = false, features = [
    "max-performance-safe",
    "sha1",
    "basic",
    "revision",
] }
# `.gitignore` semantics without reimplementing them, plus `.nooma-ignore` on
# the same footing.
ignore = "0.4"

# Parsing source into symbols. The grammars are pinned per language because
# each one tracks the core crate's ABI on its own schedule.
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"

blake3 = "1"
rayon = "1"
directories = "6"
clap = { version = "4", features = ["derive", "env"] }

tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
