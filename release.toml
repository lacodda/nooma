# How nooma is released, read by furca's release engine: `furca release plan`
# says what the next release is and what stands in its way, `furca release run`
# carries it out - bump, changelog, gate, commit, push, green CI, tag - then
# checks what went out and installs it here. `lyrn check` reads it too.
# Reference: https://lacodda.github.io/furca/reference/release/

[project]
name = "nooma"
changelog = "CHANGELOG.md"
# The workspace root carries the version of every crate and of the path
# dependencies between them; the window's frontend says it once more.
manifests = ["Cargo.toml", "app/package.json"]
# Left as written: ADRs record what happened, and the concept pages say which
# release a behaviour came with.
as_written = ["docs/adr/", "docs/src/content/docs/concepts/"]

[gate]
# Formatting only: it takes seconds and compiles nothing. The rest of the gate
# is CI, which the run waits for before the tag.
commands = [
    "cargo fmt --all --check",
]

[ci]
provider = "github"
workflow = "ci.yml"
# What the tag starts: the program and the window built on three systems, the
# release page, and the installers run against it. Nothing goes to a registry
# yet - the crate names are not claimed.
publish = "release.yml"

# The files the tag's release page has to carry: the archives the installers
# fetch, and the window's installer for each system.
[page]
assets = [
    "nooma-{tag}-x86_64-pc-windows-msvc.zip",
    "nooma-{tag}-x86_64-unknown-linux-gnu.tar.gz",
    "nooma-{tag}-aarch64-apple-darwin.tar.gz",
    "nooma_{version}_x64-setup.exe",
    "nooma_{version}_amd64.deb",
    "nooma_{version}_amd64.AppImage",
    "nooma_{version}_aarch64.dmg",
]

# The program is installed for the owner from the release by
# tools/install.ps1 and tools/install.sh, and proven to be the release's own
# build.
[post.install]
