[package]
name = "nooma"
description = "Local semantic search over your files: find a document by what it is about, fully offline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["search", "semantic-search", "embeddings", "offline", "local"]
categories = ["text-processing", "filesystem"]
# assets/icon.ico is required by build.rs on Windows; the rest of the brand
# artwork only serves GitHub and the docs site.
exclude = [
    "docs/",
    ".github/",
    "cliff.toml",
    "rustfmt.toml",
    "assets/social-preview.png",
    "assets/screenshot.png",
    "assets/logo-512.png",
    "assets/apple-touch-icon.png",
    "assets/favicon-32.png",
]

# Prose summaries shell out to the user's own Claude Code CLI, and that is the
# one thing in this product that leaves the machine. It is off unless asked
# for: a default build contains no such code path at all, which is a claim a
# user can check rather than take on trust. See docs/adr/0004.
[features]
default = []
prose = ["dep:serde", "dep:tempfile"]

[dependencies]
nooma-core = { workspace = true, features = ["semantic"] }
nooma-fetch.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap.workspace = true
serde = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile.workspace = true
