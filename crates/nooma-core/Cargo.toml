[package]
name = "nooma-core"
description = "The indexing library behind nooma: repository symbols, imports and module dependencies, read offline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["tree-sitter", "code-index", "symbols", "git", "offline"]
categories = ["development-tools", "parsing"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
gix.workspace = true
ignore.workspace = true
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-go.workspace = true
blake3.workspace = true
rayon.workspace = true
directories.workspace = true
tantivy = "0.27"
# Snowball stemmers, the ones tantivy itself stems with. Held to one minor:
# its minor is the date the upstream rules last changed, and a new one stems
# some words differently - raised together with FULLTEXT_FORMAT_VERSION, or
# the stored words are looked up by other rules and quietly do not match.
frostem = { version = "~1.20260821.8", default-features = false, features = ["russian", "english"] }
# Text out of PDF, page by page, in pure Rust. Without its default features:
# colour management is for rendering, which nooma does not do; the old RC4
# cipher stays, since a PDF locked only by an owner password still has to be
# opened with the empty one.
pdf_oxide = { version = "0.3.78", default-features = false, features = ["legacy-crypto"] }
# Ligatures and other compatibility characters a PDF's fonts map text to.
unicode-normalization = "0.1"
# Text out of Word documents: by pdf_oxide's author, and already built as
# its dependency. Its default features are none.
office_oxide = "0.1.15"
# An EPUB's archive and its pages: the zip reader and the XML reader Word
# documents are read with, and the HTML entities a book's pages use.
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.42", features = ["escape-html"] }
# Decoding text in the encodings files are found in, and guessing the one a
# file does not name - the detector Firefox uses for pages that do not.
encoding_rs = "0.8"
chardetng = "1"
# Embeddings through ONNX Runtime. The runtime is linked statically, fetched
# by `ort` when it is built - never while nooma runs.
fastembed = { version = "7.2", default-features = false, features = ["ort-download-binaries-rustls-tls"], optional = true }
# The runtime itself, for the one thing fastembed leaves to its caller: the
# environment every model is loaded into. Pinned to the version fastembed
# pins, so the two are one crate - a fastembed on another runtime fails to
# resolve rather than handing over a type from a second copy.
ort = { version = "=2.0.0-rc.15", default-features = false, optional = true }
# The approximate nearest-neighbour graph over the vectors: a C++ library
# built from source, so it lives behind the same feature as the model runner.
usearch = { version = "2.26", optional = true }

# Everything about vectors - the model runner, the store of computed vectors
# and the index searched over them - is one feature. A consumer that reads
# repositories - rigger - has no use for an inference runtime or a C++ graph
# library, and linking them costs it tens of megabytes and minutes of build.
# `nooma` and the window turn it on.
[features]
default = []
semantic = ["dep:fastembed", "dep:ort", "dep:usearch"]

[dev-dependencies]
tempfile.workspace = true

# Runs the real model, so it exists only where the model runner does.
[[test]]
name = "meaning"
required-features = ["semantic"]

[[test]]
name = "vectors"
required-features = ["semantic"]

[[example]]
name = "language_axes"
required-features = ["semantic"]
