[package]
name = "nooma-core"
description = "The indexing library behind nooma: repository symbols, imports and module dependencies, read offline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["tree-sitter", "code-index", "symbols", "git", "offline"]
categories = ["development-tools", "parsing"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
gix.workspace = true
ignore.workspace = true
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-go.workspace = true
blake3.workspace = true
rayon.workspace = true
directories.workspace = true
tantivy = "0.26"
rust-stemmers = "1"
# Embeddings through ONNX Runtime. Only the model runner is behind the
# feature: the catalogue, the vector store and the evaluation are plain Rust
# and always here. The runtime is linked statically, fetched by `ort` when it
# is built - never while nooma runs.
fastembed = { version = "7.1", default-features = false, features = ["ort-download-binaries-rustls-tls"], optional = true }

# A consumer that reads repositories - rigger - has no use for an inference
# runtime, and linking one costs it tens of megabytes and minutes of build.
# `nooma` and the window turn it on.
[features]
default = []
semantic = ["dep:fastembed"]

[dev-dependencies]
tempfile.workspace = true

# Runs the real model, so it exists only where the model runner does.
[[test]]
name = "meaning"
required-features = ["semantic"]
